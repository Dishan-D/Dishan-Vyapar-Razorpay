<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Market · Vyapar-to-Agent</title>
<link rel="stylesheet" href="/app.css" />
<script src="/socket.io/socket.io.js"></script>
<style>
  .stage { position:relative; height:calc(100vh - 132px); min-height:480px; }
  svg { width:100%; height:100%; display:block; }
  .node circle { fill:var(--surface); stroke:var(--border-2); stroke-width:1.25; }
  .node.hot circle { stroke:var(--green); stroke-width:2; }
  .node text { fill:var(--ink); font-size:12.5px; text-anchor:middle; font-weight:550; letter-spacing:-.01em; }
  .node .sub { fill:var(--ink-4); font-size:10px; font-weight:450; }
  .hub circle { fill:var(--surface); stroke:var(--ink); stroke-width:1.75; }
  .wire { stroke:var(--border); stroke-width:1.25; fill:none; }
  .pulse { stroke-width:2.5; fill:none; stroke-dasharray:6 10; opacity:0; stroke-linecap:round; }
  .caption {
    position:absolute; left:50%; transform:translateX(-50%); bottom:22px;
    background:var(--surface); border:1px solid var(--border); border-radius:999px;
    padding:9px 18px; color:var(--ink-2); font-size:13px; box-shadow:var(--shadow-md); max-width:88%;
  }
  .caption strong { color:var(--ink); font-weight:550; }
  .caption .lbl { font-size:9.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-4); font-weight:650; margin-right:8px; }
</style>
</head>
<body>
<div id="nav"></div>

<div class="stage">
  <svg id="svg" viewBox="0 0 900 560" preserveAspectRatio="xMidYMid meet"></svg>
  <div class="caption" id="cap"><span class="lbl">idle</span>Waiting for activity…</div>
</div>

<script type="module">
import { boot, esc as escape } from "/ui.js";
const svg = document.getElementById("svg");
const NS = "http://www.w3.org/2000/svg";
const esc = escape;

/* Event families share the ticker's colours, so the two views read as one system. */
/* Same families, same colours as the merchant activity stream. */
const COLOR = {
  discovery: "#2a78d6", negotiation: "#eb6834", payment: "#127a4d",
  fulfillment: "#127a4d", clarification: "#a86a09", extraction: "#8b909e", audit: "#2a78d6",
};

const el = (name, attrs, parent) => {
  const n = document.createElementNS(NS, name);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, String(v));
  (parent ?? svg).appendChild(n);
  return n;
};

const HUB = { x: 450, y: 280 };
const nodes = new Map();

const { merchants } = await (await fetch("/merchants")).json();

// Merchants around the buyer-agent, evenly spaced.
merchants.forEach((m, i) => {
  const angle = (i / merchants.length) * Math.PI * 2 - Math.PI / 2;
  const x = HUB.x + Math.cos(angle) * 300;
  const y = HUB.y + Math.sin(angle) * 190;
  nodes.set(m.merchant_id, { x, y, name: m.name, city: m.city });
});

for (const [, n] of nodes) el("path", { class: "wire", d: `M${HUB.x} ${HUB.y} Q ${(HUB.x + n.x) / 2} ${(HUB.y + n.y) / 2 - 40} ${n.x} ${n.y}` });

const pulses = new Map();
for (const [id, n] of nodes) {
  pulses.set(id, el("path", { class: "pulse", d: `M${HUB.x} ${HUB.y} Q ${(HUB.x + n.x) / 2} ${(HUB.y + n.y) / 2 - 40} ${n.x} ${n.y}` }));
}

const hub = el("g", { class: "node hub" });
el("circle", { cx: HUB.x, cy: HUB.y, r: 46 }, hub);
el("text", { x: HUB.x, y: HUB.y - 2 }, hub).textContent = "buyer-agent";
const hubSub = el("text", { x: HUB.x, y: HUB.y + 14, class: "sub" }, hub);
hubSub.textContent = "idle";

const groups = new Map();
for (const [id, n] of nodes) {
  const gEl = el("g", { class: "node" });
  el("circle", { cx: n.x, cy: n.y, r: 42 }, gEl);
  el("text", { x: n.x, y: n.y - 2 }, gEl).textContent = n.name.split(" ")[0];
  el("text", { x: n.x, y: n.y + 14, class: "sub" }, gEl).textContent = n.city;
  groups.set(id, gEl);
}

/** One event, one line lighting up. Nothing here is simulated — it is the bus. */
function flash(merchantId, type, message) {
  const family = type.split(".")[0];
  const colour = COLOR[family] ?? "#2a78d6";
  document.getElementById("cap").innerHTML =
    `<span class="lbl">${esc(family)}</span><strong>${esc(message)}</strong>`;

  const pulse = merchantId ? pulses.get(merchantId) : null;
  const group = merchantId ? groups.get(merchantId) : null;
  if (!pulse || !group) {
    hubSub.textContent = family;
    return;
  }

  group.classList.add("hot");
  hubSub.textContent = family;
  pulse.setAttribute("stroke", colour);
  pulse.animate(
    [
      { opacity: 0, strokeDashoffset: 120 },
      { opacity: 1, strokeDashoffset: 60, offset: 0.3 },
      { opacity: 0, strokeDashoffset: 0 },
    ],
    { duration: 1100, easing: "ease-out" },
  );
  setTimeout(() => group.classList.remove("hot"), 1100);
}

/**
 * Events arrive in bursts — a whole purchase can finish inside a second — so
 * they are played out at a readable spacing. This paces the display of real
 * events; it never invents one, and the queue drains to empty.
 */
const queue = [];
let playing = false;

async function play() {
  if (playing) return;
  playing = true;
  while (queue.length > 0) {
    const e = queue.shift();
    flash(e.merchant_id, e.type, e.message);
    await new Promise((r) => setTimeout(r, queue.length > 8 ? 90 : 260));
  }
  playing = false;
}

await boot({ onEvent: (e) => { queue.push(e); play(); } });
</script>
</body>
</html>
