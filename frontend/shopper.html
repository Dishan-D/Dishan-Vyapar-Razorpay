<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shopper · Vyapar-to-Agent</title>
<link rel="stylesheet" href="/app.css" />
<script src="/socket.io/socket.io.js"></script>
<style>
  .wrap { max-width:860px; margin:0 auto; padding:22px 26px 70px; display:grid; gap:18px; }
  .ask { display:grid; grid-template-columns:1fr 132px 132px auto; gap:11px; align-items:end; }
  @media (max-width:780px){ .ask { grid-template-columns:1fr; } }
  .thread { display:grid; gap:11px; }
  .msg { max-width:90%; padding:12px 15px; border-radius:15px; font-size:14px; line-height:1.55; }
  .msg.agent { background:var(--card-2); border:1px solid var(--line); border-bottom-left-radius:5px; }
  .msg.think { background:transparent; border:1px dashed var(--line-2); color:var(--ink-3); font-size:13px; }
  .msg.me { background:linear-gradient(180deg,#3585e6,var(--s1)); color:#fff; margin-left:auto; border-bottom-right-radius:5px; font-weight:550; }
  .msg .why { color:var(--ink-3); font-size:12px; margin-top:5px; }
  .offers { display:grid; gap:11px; }
  .offer { border:1px solid var(--line); border-radius:12px; padding:13px; background:var(--card); }
  .offer.win { border-color:var(--good); background:var(--good-bg); }
  .offer h4 { margin:0 0 2px; font-size:14.5px; }
  .offer .row { display:flex; justify-content:space-between; gap:10px; font-size:13.5px; align-items:baseline; }
  .offer .rd { color:var(--ink-3); font-size:12px; }
  .turns { margin-top:9px; display:grid; gap:3px; }
  .turns div { font-size:11.5px; color:var(--ink-2); font-family:var(--mono); }
  .verdict { font-size:13.5px; color:var(--ink-2); }
  .verdict + .verdict { margin-top:4px; }
</style>
</head>
<body>
<header>
  <span class="brand">Vyapar-to-Agent</span>
  <nav class="tabs">
    <a href="/">Shop</a>
    <a href="/merchant.html">Merchant</a>
    <a href="/shopper.html" class="on">Shopper</a>
    <a href="/market.html">Market</a>
  </nav>
  <span class="spacer"></span>
  <span class="pill" id="conn">connecting…</span>
</header>

<div class="wrap">
  <section>
    <h2><span class="n">1</span>Tell the buyer-agent what you want</h2>
    <div class="ask">
      <div><label for="want">What are you after?</label><input id="want" value="silicone phone case" /></div>
      <div><label for="max">Most you'll pay</label><input id="max" type="number" value="320" /></div>
      <div><label for="open">Open at</label><input id="open" type="number" value="220" /></div>
      <button class="cta" id="go">Send it shopping</button>
    </div>
  </section>

  <section>
    <h2><span class="n">2</span>The agent's thinking</h2>
    <div class="thread" id="thread"><p class="empty">Nothing yet.</p></div>
  </section>
</div>

<script type="module">
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const rupee = (n) => "₹" + Number(n).toLocaleString("en-IN");
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

const api = async (p, o) => {
  const res = await fetch(p, { ...o, headers: { "content-type": "application/json", ...(o?.headers ?? {}) } });
  return { status: res.status, body: await res.json() };
};

const thread = $("thread");
let first = true;
function say(kind, html) {
  if (first) { thread.innerHTML = ""; first = false; }
  const el = document.createElement("div");
  el.className = `msg ${kind}`;
  el.innerHTML = html;
  thread.appendChild(el);
  el.scrollIntoView({ behavior: "smooth", block: "nearest" });
  return el;
}

/**
 * The agent narrates as it goes. Each line is a real step it took — the pauses
 * exist so a viewer can follow the reasoning, not to fake work that isn't happening.
 */
async function shop() {
  thread.innerHTML = "";
  first = true;
  $("go").disabled = true;

  const want = $("want").value;
  const max_price = Number($("max").value);
  const opening_offer = Number($("open").value);

  say("me", `${esc(want)} — up to ${rupee(max_price)}.`);
  await sleep(400);

  const thinking = say("think", "Looking for shops that stock it…");
  const { body: cmp } = await api("/marketplace/compare", {
    method: "POST",
    body: JSON.stringify({ want, max_price, opening_offer }),
  });

  if (cmp.offers.length === 0) {
    thinking.remove();
    say("agent", "Nobody I can reach stocks that right now.");
    $("go").disabled = false;
    return;
  }

  thinking.textContent = `Found ${cmp.offers.length} shop(s). Haggling with each, separately.`;
  await sleep(600);

  const cards = cmp.offers.map((o) => {
    const win = cmp.selected?.merchant_id === o.merchant_id;
    return `<div class="offer${win ? " win" : ""}">
      <div class="row"><h4>${esc(o.merchant_name)}</h4><span class="rd">readiness ${o.readiness.score}/100</span></div>
      <div class="rd">${esc(o.item_name)} · list ${rupee(o.list_price)}</div>
      <div class="turns">${o.outcome.log.map((t) => `<div>r${t.round} ${t.actor === "buyer" ? "me" : "them"} ${t.amount ? rupee(t.amount) : "—"} <span style="opacity:.6">${esc(t.rationale)}</span></div>`).join("")}</div>
      <div class="row" style="margin-top:8px">
        <strong>${o.eligible ? rupee(o.final_price) : "no deal"}</strong>
        <span class="rd">${o.eligible ? `${rupee(o.effective_price)} once I price in their record` : esc(o.note)}</span>
      </div>
    </div>`;
  }).join("");

  say("agent", `<div class="offers">${cards}</div>`);
  await sleep(500);

  say("agent", cmp.reasoning.map((line) => `<div class="verdict">${esc(line)}</div>`).join(""));

  if (cmp.selected) {
    await sleep(400);
    say("think", `Buying from ${esc(cmp.selected.merchant_name)}…`);
    // item_id, not the name: the agent already chose a shop, and two of them
    // stock this under the same name. Re-searching would quietly pick the cheaper.
    const { status, body } = await api("/transactions", {
      method: "POST",
      body: JSON.stringify({
        want: cmp.selected.item_name,
        item_id: cmp.selected.item_id,
        max_price,
        opening_offer,
      }),
    });
    if (status === 201) {
      say("agent",
        body.status === "awaiting_payment"
          ? `Order <span class="mono">${esc(body.order_id)}</span> opened for ${rupee(body.final_price)} — waiting on Razorpay Checkout.<div class="why">A payment id only exists once someone actually pays.</div>`
          : `Paid ${rupee(body.final_price)}. <span class="mono">${esc(body.payment_id)}</span><div class="why">Signed chain: <a href="/transactions/${body.transaction_id}/audit" target="_blank">audit it</a></div>`);
    } else {
      say("agent", `Couldn't complete: ${esc(body.error ?? body.reason ?? "unknown")}`);
    }
  }

  $("go").disabled = false;
}

$("go").onclick = shop;

const socket = io();
socket.on("connect", () => { $("conn").textContent = "live"; $("conn").className = "pill live"; });
socket.on("disconnect", () => { $("conn").textContent = "offline"; $("conn").className = "pill warn"; });
</script>
</body>
</html>
